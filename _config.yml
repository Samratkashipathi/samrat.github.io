title: Samrat K S
description: "Learnings"
url: "https://samratkashipathi.github.io"
baseurl: "/samrat.github.io"

remote_theme: mmistakes/minimal-mistakes

# Minimal Mistakes Configuration
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-9MC70VVQZ4"
    anonymize_ip: false

# Author Details
author:
  name: Samrat K S
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Samratkashipathi"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/samratkashipathi/"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# Defaults
defaults:
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true